name: Mukorob PDF QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Structural smoke tests
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/mukorob-http.log 2>&1 &
      - name: Browser smoke tests
        run: npm run test:browser
